site_name: VisiData for Mere Mortals
site_description: A spreadsheet that lives in a terminal. Opening CSV, JSON and SQLite files as sheets you can sort, select and summarise with a few keys, editing a cell and saving it back, and converting between formats, with the traps and the limits stated plainly.
